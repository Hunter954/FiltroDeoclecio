{% extends 'base.html' %}{% block title %}Criar foto • {{ featured.name }}{% endblock %}
{% block body %}
<div class="site editor-site" style="--brand:{{featured.primary_color}};--accent:{{featured.accent_color}}">
<main class="editor-simple-main">
<section class="editor-simple-section"><div class="wrap editor-simple-wrap">
<div class="editor-topline"><a href="{{ url_for('public.filter_page', slug=featured.slug) }}" class="editor-back">← Voltar</a><div class="editor-filter-name" id="filterName">{{featured.name}}</div></div>
<div class="editor-simple-card">
  <div class="editor-canvas-area {{'has-filter-nav' if filters|length > 1 else 'no-filter-nav'}}">
    {% if filters|length > 1 %}<button class="filter-arrow filter-prev" id="filterPrev" aria-label="Filtro anterior">‹</button>{% endif %}
    <div class="editor-stage" id="editorStage"><canvas id="editorCanvas" width="1080" height="1080"></canvas><button class="stage-hint" id="stageHint" type="button"><div>↑</div><b>Escolha uma foto para começar</b><small>JPG, PNG ou WEBP • até 15 MB</small></button></div>
    {% if filters|length > 1 %}<button class="filter-arrow filter-next" id="filterNext" aria-label="Próximo filtro">›</button>{% endif %}
  </div>
  <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" hidden>
  <div class="editor-live-controls" id="liveControls" hidden>
    <div class="zoom-compact"><button type="button" id="zoomOut" aria-label="Diminuir zoom">−</button><span>Zoom</span><button type="button" id="zoomIn" aria-label="Aumentar zoom">+</button></div>
    <button class="btn btn-primary finish-simple" id="finishPhoto">Finalizar foto</button>
  </div>
  <div class="editor-done" id="doneState" hidden><div class="success-mark">✓</div><h2>Sua foto ficou pronta!</h2><a class="btn btn-primary" id="downloadPhoto" href="#">↓ Baixar minha foto</a><button class="btn btn-soft" id="makeAnother">Fazer outra foto</button></div>
</div>
</div></section>
</main>
</div>
<script>window.FILTER_CONFIG={{ {'id':featured.id,'overlay':url_for('public.filter_asset',filter_id=featured.id,kind='overlay'),'name':featured.name,'filters':filters|map(attribute='id')|list}|tojson }};window.FILTER_OPTIONS={{ filters|map(attribute='id')|list|tojson }};</script>
<script>
window.FILTERS = [
{% for f in filters %}{id:{{f.id}},name:{{f.name|tojson}},slug:{{f.slug|tojson}},overlay:{{url_for('public.filter_asset',filter_id=f.id,kind='overlay')|tojson}}}{% if not loop.last %},{% endif %}{% endfor %}
];
</script>
{% endblock %}
